name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Bun 🔧
        uses: oven-sh/setup-bun@v2
        with:
          version: "latest"

      - name: Install, lint, build 🏗️
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages 🚀
        uses: actions/deploy-pages@v4